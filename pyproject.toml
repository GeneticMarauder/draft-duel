[project]
name = "lsv-duel-draft"
version = "0.1.0"
description = "Builds a Tabletop Simulator 1v1 pick-from-5 draft of LSV's powered cube"
readme = "README.md"
authors = [
    { name = "Justin Hittell", email = "justin.hittell@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=13.0.0",
]

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lupa>=2.8",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[project.scripts]
lsv-duel-draft = "lsv_duel_draft.cli:main"
